apiVersion: apps/v1
kind: Deployment
metadata:
  name: intellmeet-web
spec:
  replicas: 2
  selector: { matchLabels: { app: intellmeet-web } }
  template:
    metadata: { labels: { app: intellmeet-web } }
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/intellmeet-web:latest
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: intellmeet-web }
spec:
  selector: { app: intellmeet-web }
  ports: [{ port: 80, targetPort: 80 }]
