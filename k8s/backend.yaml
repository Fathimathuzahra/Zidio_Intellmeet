apiVersion: apps/v1
kind: Deployment
metadata:
  name: intellmeet-api
spec:
  replicas: 2
  selector: { matchLabels: { app: intellmeet-api } }
  template:
    metadata: { labels: { app: intellmeet-api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/intellmeet-api:latest
          ports: [{ containerPort: 5000 }]
          envFrom: [{ secretRef: { name: intellmeet-api-secrets } }]
          readinessProbe: { httpGet: { path: /api/health, port: 5000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /api/health, port: 5000 }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: intellmeet-api }
spec:
  selector: { app: intellmeet-api }
  ports: [{ port: 80, targetPort: 5000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: intellmeet-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: intellmeet-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
