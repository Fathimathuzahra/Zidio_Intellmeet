services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/intellmeet
    ports: ["5000:5000"]
    depends_on: [mongo]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  mongo-data:
